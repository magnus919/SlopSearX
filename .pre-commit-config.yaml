repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Keep historical raw captures byte-exact; validation hooks still inspect them.
      - id: trailing-whitespace
        exclude: ^docs/experiments/evidence/(.*\.(json|txt)|EXP-003/reproduce\.md)$|^(?:crates/ssx\-domain/tests/fixtures/a05_previous_media_sanitizer\.rs|crates/ssx\-source\-codecs/MAPPING\-SOURCE\-NOTICES\.txt|crates/ssx\-source\-codecs/MAPPING\-UPSTREAM\-NOTICES\.txt|crates/ssx\-source\-codecs/MAPPING\-UPSTREAM\-SINGLEBYTE\-NOTICES\.txt|crates/ssx\-source\-codecs/PYTHON\-SOURCE\-NOTICES\.txt|crates/ssx\-source\-codecs/UNICODE\-SOURCE\-HEADERS\.txt|crates/ssx\-source\-codecs/provenance/idna/RFC3454\-ORIGINAL\-NOTICE\.txt|crates/ssx\-source\-codecs/provenance/idna/UNICODE\-3\.2\-ORIGINAL\-NOTICE\.html|crates/ssx\-source\-codecs/provenance/idna/UnicodeCharacterDatabase\-3\.2\.0\.html|crates/ssx\-source\-codecs/provenance/idna/idna\.py|crates/ssx\-source\-codecs/provenance/idna/inputs/CompositionExclusions\-3\.2\.0\.txt|crates/ssx\-source\-codecs/provenance/idna/inputs/SpecialCasing\-16\.0\.0\.txt|crates/ssx\-source\-codecs/provenance/idna/inputs/aliases\.py|crates/ssx\-source\-codecs/provenance/idna/inputs/stringprep\.py|crates/ssx\-source\-codecs/provenance/idna/mkstringprep\.py|crates/ssx\-source\-codecs/provenance/idna/rfc3454\.txt|crates/ssx\-source\-codecs/provenance/singlebyte\-icu/koi8\-t\.ucm|docs/rust\-rewrite/a05/libxml\-safe\-api\-proposal\.patch|docs/rust\-rewrite/a05/surrogate\-iconv\-version\-comparison\.json|vendor/libxml/\.cargo_vcs_info\.json|vendor/libxml/\.rustfmt\.toml|vendor/libxml/CHANGELOG\.md|vendor/libxml/README\.md|vendor/libxml/appveyor\.yml|vendor/libxml/src/wrapper\.h|vendor/libxml/tests/VALGRIND\.md|vendor/libxml/tests/resources/canonical_1_1/3_1_input\.xml|vendor/libxml/tests/resources/canonical_1_1/3_1_output\.xml|vendor/libxml/tests/resources/canonical_1_1/3_1_output_no_comment\.xml|vendor/libxml/tests/resources/canonical_1_1/3_2_input\.xml|vendor/libxml/tests/resources/canonical_1_1/Readme\.md|vendor/libxml/tests/resources/canonical_exclusive/1_input\.xml|vendor/libxml/tests/resources/canonical_exclusive/1_output\.xml|vendor/libxml/tests/resources/example\.html|vendor/libxml/tests/resources/file01_utf16le\.xml|vendor/libxml/tests/resources/file01_utf16le_bom\.xml|vendor/libxml/tests/resources/ids\.xml|vendor/libxml/tests/resources/staff\.xml|vendor/libxml/tests/resources/unformatted\.xml|vendor/libxml2/a05\-normal\-data\-nul\.patch)$|^docs/rust-rewrite/o01/evidence/original53-v[12]-stdout\.log$
      # F13 raw fixture proves exact durable bytes; check-json remains enabled.
      - id: end-of-file-fixer
        exclude: ^(docs/experiments/evidence/(.*\.(json|txt)|EXP-003/reproduce\.md)|crates/xtask/fixtures/f13/native-record\.json|docs/rust-rewrite/t06/validation\.json)$|^(?:crates/ssx\-domain/tests/fixtures/a05_previous_media_sanitizer\.rs|crates/ssx\-source\-codecs/MAPPING\-SOURCE\-NOTICES\.txt|crates/ssx\-source\-codecs/MAPPING\-UPSTREAM\-NOTICES\.txt|crates/ssx\-source\-codecs/MAPPING\-UPSTREAM\-SINGLEBYTE\-NOTICES\.txt|crates/ssx\-source\-codecs/PYTHON\-SOURCE\-NOTICES\.txt|crates/ssx\-source\-codecs/UNICODE\-SOURCE\-HEADERS\.txt|crates/ssx\-source\-codecs/provenance/idna/RFC3454\-ORIGINAL\-NOTICE\.txt|crates/ssx\-source\-codecs/provenance/idna/UNICODE\-3\.2\-ORIGINAL\-NOTICE\.html|crates/ssx\-source\-codecs/provenance/idna/UnicodeCharacterDatabase\-3\.2\.0\.html|crates/ssx\-source\-codecs/provenance/idna/idna\.py|crates/ssx\-source\-codecs/provenance/idna/inputs/CompositionExclusions\-3\.2\.0\.txt|crates/ssx\-source\-codecs/provenance/idna/inputs/SpecialCasing\-16\.0\.0\.txt|crates/ssx\-source\-codecs/provenance/idna/inputs/aliases\.py|crates/ssx\-source\-codecs/provenance/idna/inputs/stringprep\.py|crates/ssx\-source\-codecs/provenance/idna/mkstringprep\.py|crates/ssx\-source\-codecs/provenance/idna/rfc3454\.txt|crates/ssx\-source\-codecs/provenance/singlebyte\-icu/koi8\-t\.ucm|docs/rust\-rewrite/a05/libxml\-safe\-api\-proposal\.patch|docs/rust\-rewrite/a05/surrogate\-iconv\-version\-comparison\.json|vendor/libxml/\.cargo_vcs_info\.json|vendor/libxml/\.rustfmt\.toml|vendor/libxml/CHANGELOG\.md|vendor/libxml/README\.md|vendor/libxml/appveyor\.yml|vendor/libxml/src/wrapper\.h|vendor/libxml/tests/VALGRIND\.md|vendor/libxml/tests/resources/canonical_1_1/3_1_input\.xml|vendor/libxml/tests/resources/canonical_1_1/3_1_output\.xml|vendor/libxml/tests/resources/canonical_1_1/3_1_output_no_comment\.xml|vendor/libxml/tests/resources/canonical_1_1/3_2_input\.xml|vendor/libxml/tests/resources/canonical_1_1/Readme\.md|vendor/libxml/tests/resources/canonical_exclusive/1_input\.xml|vendor/libxml/tests/resources/canonical_exclusive/1_output\.xml|vendor/libxml/tests/resources/example\.html|vendor/libxml/tests/resources/file01_utf16le\.xml|vendor/libxml/tests/resources/file01_utf16le_bom\.xml|vendor/libxml/tests/resources/ids\.xml|vendor/libxml/tests/resources/staff\.xml|vendor/libxml/tests/resources/unformatted\.xml|vendor/libxml2/a05\-normal\-data\-nul\.patch)$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: debug-statements
      - id: mixed-line-ending
        exclude: ^(?:crates/ssx\-domain/tests/fixtures/a05_previous_media_sanitizer\.rs|crates/ssx\-source\-codecs/MAPPING\-SOURCE\-NOTICES\.txt|crates/ssx\-source\-codecs/MAPPING\-UPSTREAM\-NOTICES\.txt|crates/ssx\-source\-codecs/MAPPING\-UPSTREAM\-SINGLEBYTE\-NOTICES\.txt|crates/ssx\-source\-codecs/PYTHON\-SOURCE\-NOTICES\.txt|crates/ssx\-source\-codecs/UNICODE\-SOURCE\-HEADERS\.txt|crates/ssx\-source\-codecs/provenance/idna/RFC3454\-ORIGINAL\-NOTICE\.txt|crates/ssx\-source\-codecs/provenance/idna/UNICODE\-3\.2\-ORIGINAL\-NOTICE\.html|crates/ssx\-source\-codecs/provenance/idna/UnicodeCharacterDatabase\-3\.2\.0\.html|crates/ssx\-source\-codecs/provenance/idna/idna\.py|crates/ssx\-source\-codecs/provenance/idna/inputs/CompositionExclusions\-3\.2\.0\.txt|crates/ssx\-source\-codecs/provenance/idna/inputs/SpecialCasing\-16\.0\.0\.txt|crates/ssx\-source\-codecs/provenance/idna/inputs/aliases\.py|crates/ssx\-source\-codecs/provenance/idna/inputs/stringprep\.py|crates/ssx\-source\-codecs/provenance/idna/mkstringprep\.py|crates/ssx\-source\-codecs/provenance/idna/rfc3454\.txt|crates/ssx\-source\-codecs/provenance/singlebyte\-icu/koi8\-t\.ucm|docs/rust\-rewrite/a05/libxml\-safe\-api\-proposal\.patch|docs/rust\-rewrite/a05/surrogate\-iconv\-version\-comparison\.json|vendor/libxml/\.cargo_vcs_info\.json|vendor/libxml/\.rustfmt\.toml|vendor/libxml/CHANGELOG\.md|vendor/libxml/README\.md|vendor/libxml/appveyor\.yml|vendor/libxml/src/wrapper\.h|vendor/libxml/tests/VALGRIND\.md|vendor/libxml/tests/resources/canonical_1_1/3_1_input\.xml|vendor/libxml/tests/resources/canonical_1_1/3_1_output\.xml|vendor/libxml/tests/resources/canonical_1_1/3_1_output_no_comment\.xml|vendor/libxml/tests/resources/canonical_1_1/3_2_input\.xml|vendor/libxml/tests/resources/canonical_1_1/Readme\.md|vendor/libxml/tests/resources/canonical_exclusive/1_input\.xml|vendor/libxml/tests/resources/canonical_exclusive/1_output\.xml|vendor/libxml/tests/resources/example\.html|vendor/libxml/tests/resources/file01_utf16le\.xml|vendor/libxml/tests/resources/file01_utf16le_bom\.xml|vendor/libxml/tests/resources/ids\.xml|vendor/libxml/tests/resources/staff\.xml|vendor/libxml/tests/resources/unformatted\.xml|vendor/libxml2/a05\-normal\-data\-nul\.patch)$
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        # Exact frozen T06/W06/A10/A11 captures and ledgers; JSON/native hash validation remains enabled.
        exclude: ^docs/rust-rewrite/t06/(entities|validation)\.json$|^docs/rust-rewrite/w06/(source\.json|evidence/source-before-(composite-id-correction|unique-snapshot-ids)\.json|evidence/review-public-source-outcomes\.json)$|^docs/rust-rewrite/a10/(source-boundaries-v2\.json|native-differences-v1\.json)$|^docs/rust-rewrite/a11/(source-boundaries-v2|native-differences-v1)\.json$
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        exclude: ^(?:crates/ssx\-source\-codecs/provenance/idna/idna\.py|crates/ssx\-source\-codecs/provenance/idna/inputs/aliases\.py|crates/ssx\-source\-codecs/provenance/idna/inputs/stringprep\.py|crates/ssx\-source\-codecs/provenance/idna/mkstringprep\.py)$|^docs/rust-rewrite/t06/(capture|legacy_capture|policy_capture|boundaries_capture|entities_capture|snapshots_capture|prompts_capture|bounds_capture)\.py$
        args: [--fix]
      - id: ruff-format
        exclude: ^(?:crates/ssx\-source\-codecs/provenance/idna/idna\.py|crates/ssx\-source\-codecs/provenance/idna/inputs/aliases\.py|crates/ssx\-source\-codecs/provenance/idna/inputs/stringprep\.py|crates/ssx\-source\-codecs/provenance/idna/mkstringprep\.py)$|^docs/rust-rewrite/t06/(capture|legacy_capture|policy_capture|boundaries_capture|entities_capture|snapshots_capture|prompts_capture|bounds_capture)\.py$

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: .venv/bin/lint-imports
        language: script
        pass_filenames: false
        files: ^slopsearx/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--strict, --ignore-missing-imports]
        additional_dependencies:
          - fastmcp>=2.0,<5
          - fastapi>=0.115.0
          - httpx>=0.28.0
          - lxml>=5.3.0
          - pyyaml>=6.0
          - valkey>=6.0.0
          - pytest>=8.0
          - pytest-asyncio>=0.24.0
          - types-pyyaml>=6.0
        files: ^(slopsearx/|engines/)
