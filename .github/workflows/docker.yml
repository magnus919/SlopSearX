name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/magnus919/slopsearx

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Verify pinned Docker base digest
        run: python3 scripts/verify_docker_base_digest.py

      - name: Build and load image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true
          build-args: |
            DEBIAN_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Get primary image tag
        id: tag
        run: echo "ref=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" >> $GITHUB_OUTPUT

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tag.outputs.ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Smoke test container
        run: |
          docker run -d --name slopsearx-smoke -p 8080:8080 ${{ steps.tag.outputs.ref }}
          sleep 3
          curl -f --retry 5 --retry-delay 2 http://localhost:8080/health
          docker stop slopsearx-smoke
          docker rm slopsearx-smoke

      - name: Push to registry
        if: github.event_name == 'push'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            docker push "$tag"
          done

      - name: Prune untagged versions past retention
        if: github.event_name == 'push'
        shell: bash
        run: |
          # Deployment manifests pin the image by digest (issue #210). A
          # re-run of this workflow for the same commit produces a new digest
          # under the same short-SHA tag, briefly orphaning the pinned one.
          # Retention keeps orphaned digests alive long enough for the
          # scheduled image-promotion workflow (or a human) to heal the pin.
          echo "Pruning untagged slopsearx versions older than ${RETENTION_DAYS} days"
          cutoff="$(date -u -d "-${RETENTION_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          query=".[] | select((.metadata.container.tags == null or (.metadata.container.tags | length) == 0) and (.created_at < \"${cutoff}\")) | .id"
          gh api \
            --method GET \
            "/users/magnus919/packages/container/slopsearx/versions?per_page=100" \
            --jq "$query" \
            | while read -r version_id; do
              echo "  Deleting version $version_id"
              gh api --method DELETE \
                "/users/magnus919/packages/container/slopsearx/versions/$version_id" --silent
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_DAYS: "14"
