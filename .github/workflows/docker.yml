name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/magnus919/slopsearx

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Configure hosted-runner Docker Hub cache
        run: python3 scripts/configure_ci_dockerhub_mirror.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Set architecture image tag
        id: tag
        # Match the lifetime of the existing short-SHA manifest tag. Reruns
        # supersede these tags, allowing orphaned children to age out too.
        run: echo "ref=${IMAGE_NAME}:${GITHUB_SHA::7}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Build and test native image operations
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          set -euo pipefail
          ops_root="$RUNNER_TEMP/ssx-image-ops"
          mkdir -m 700 "$ops_root"
          mkdir -m 700 "$ops_root/tmp" "$ops_root/tool"
          export CARGO_TARGET_DIR="$ops_root/target" CARGO_HOME="$ops_root/cargo-home" TMPDIR="$ops_root/tmp"
          rustc --version --verbose
          host=$(rustc --version --verbose | sed -n 's/^host: //p')
          case '${{ matrix.arch }}' in
            amd64) test "$host" = x86_64-unknown-linux-gnu ;;
            arm64) test "$host" = aarch64-unknown-linux-gnu ;;
            *) exit 1 ;;
          esac
          cargo test --locked -p ssx-ops -- --test-threads=1
          cargo build --locked -p ssx-ops --bin ssx-ops
          cp "$CARGO_TARGET_DIR/debug/ssx-ops" "$ops_root/tool/ssx-ops"
          chmod 700 "$ops_root/tool/ssx-ops"
          (cd "$ops_root/tool" && sha256sum ssx-ops > ssx-ops.sha256)
          cat "$ops_root/tool/ssx-ops.sha256"
          printf 'SSX_IMAGE_OPS_BIN=%s\n' "$ops_root/tool/ssx-ops" >> "$GITHUB_ENV"

      - name: Verify pinned Docker base digest
        run: '"$SSX_IMAGE_OPS_BIN" verify-base-digests --dockerfile Dockerfile'

      - name: Build and load image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.tag.outputs.ref }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          pull: true
          build-args: |
            DEBIAN_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tag.outputs.ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Smoke test container
        run: |
          trap 'docker rm -f slopsearx-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name slopsearx-smoke -p 8080:8080 ${{ steps.tag.outputs.ref }}
          sleep 3
          curl -f --retry 5 --retry-delay 2 http://localhost:8080/health
          python3 scripts/portal_release_smoke.py --base-url http://localhost:8080 --expected-theme dark
          # Actual shipped probe: direct local health despite hostile proxy environment.
          docker exec -e HTTP_PROXY=http://127.0.0.1:9 -e http_proxy=http://127.0.0.1:9 \
            -e ALL_PROXY=http://127.0.0.1:9 -e NO_PROXY= -e no_proxy= \
            slopsearx-smoke /usr/local/bin/ssx-healthcheck
          # A fresh container with no server must fail, silently, with exit one.
          set +e
          output=$(docker run --rm --entrypoint /usr/local/bin/ssx-healthcheck ${{ steps.tag.outputs.ref }} 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          test -z "$output"
          docker stop slopsearx-smoke
          docker rm slopsearx-smoke

      - name: Smoke test configured Darker default
        run: |
          docker run -d --name slopsearx-smoke-darker -p 8081:8080 \
            -e SLOPSEARX_PORTAL_DEFAULT_THEME=darker \
            ${{ steps.tag.outputs.ref }}
          sleep 3
          curl -f --retry 5 --retry-delay 2 http://localhost:8081/health
          python3 scripts/portal_release_smoke.py --base-url http://localhost:8081 --expected-theme darker
          docker stop slopsearx-smoke-darker
          docker rm slopsearx-smoke-darker

      - name: Push tested architecture image
        if: github.event_name == 'push'
        env:
          IMAGE_REF: ${{ steps.tag.outputs.ref }}
        run: |
          docker push "$IMAGE_REF"
          mkdir -p digests
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF" > "digests/${{ matrix.arch }}"

      - name: Upload tested image digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

      - name: Hand off native manifest verifier
        if: github.event_name == 'push' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: native-image-ops-amd64
          path: ${{ runner.temp }}/ssx-image-ops/tool/
          if-no-files-found: error
          retention-days: 1

      - name: Retire native image operations build inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ssx-image-ops"

  publish-manifest:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Download native manifest verifier from this run
        uses: actions/download-artifact@v8
        with:
          name: native-image-ops-amd64
          path: ${{ runner.temp }}/ssx-image-ops/tool

      - name: Verify native manifest verifier input
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          cd "$RUNNER_TEMP/ssx-image-ops/tool"
          sha256sum --check ssx-ops.sha256
          chmod 700 ssx-ops

      - name: Publish manifest from tested digests
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${tags[@]}" "$(cat digests/amd64)" "$(cat digests/arm64)"
          while IFS= read -r tag; do
            docker buildx imagetools inspect "$tag" --raw > manifest.json
            "$RUNNER_TEMP/ssx-image-ops/tool/ssx-ops" verify-image-platforms --manifest manifest.json
          done <<< "$IMAGE_TAGS"

      - name: Prune untagged versions past retention
        if: github.event_name == 'push'
        shell: bash
        run: |
          # Deployment manifests pin the image by digest (issue #210). A
          # re-run of this workflow for the same commit produces a new digest
          # under the same short-SHA tag, briefly orphaning the pinned one.
          # Retention keeps orphaned digests alive long enough for the
          # scheduled image-promotion workflow (or a human) to heal the pin.
          echo "Pruning untagged slopsearx versions older than ${RETENTION_DAYS} days"
          cutoff="$(date -u -d "-${RETENTION_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          query=".[] | select((.metadata.container.tags == null or (.metadata.container.tags | length) == 0) and (.created_at < \"${cutoff}\")) | .id"
          gh api \
            --method GET \
            "/users/magnus919/packages/container/slopsearx/versions?per_page=100" \
            --jq "$query" \
            | while read -r version_id; do
              echo "  Deleting version $version_id"
              gh api --method DELETE \
                "/users/magnus919/packages/container/slopsearx/versions/$version_id" --silent
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_DAYS: "14"

      - name: Retire native manifest verifier
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ssx-image-ops"
