name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/magnus919/slopsearx

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Set architecture image tag
        id: tag
        run: echo "ref=${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Verify pinned Docker base digest
        run: python3 scripts/verify_docker_base_digest.py

      - name: Build and load image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.tag.outputs.ref }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          pull: true
          build-args: |
            DEBIAN_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tag.outputs.ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Smoke test container
        run: |
          docker run -d --name slopsearx-smoke -p 8080:8080 ${{ steps.tag.outputs.ref }}
          sleep 3
          curl -f --retry 5 --retry-delay 2 http://localhost:8080/health
          python3 scripts/portal_release_smoke.py --base-url http://localhost:8080 --expected-theme dark
          docker stop slopsearx-smoke
          docker rm slopsearx-smoke

      - name: Smoke test configured Darker default
        run: |
          docker run -d --name slopsearx-smoke-darker -p 8081:8080 \
            -e SLOPSEARX_PORTAL_DEFAULT_THEME=darker \
            ${{ steps.tag.outputs.ref }}
          sleep 3
          curl -f --retry 5 --retry-delay 2 http://localhost:8081/health
          python3 scripts/portal_release_smoke.py --base-url http://localhost:8081 --expected-theme darker
          docker stop slopsearx-smoke-darker
          docker rm slopsearx-smoke-darker

      - name: Push tested architecture image
        if: github.event_name == 'push'
        env:
          IMAGE_REF: ${{ steps.tag.outputs.ref }}
        run: |
          docker push "$IMAGE_REF"
          mkdir -p digests
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF" > "digests/${{ matrix.arch }}"

      - name: Upload tested image digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish-manifest:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Publish manifest from tested digests
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${tags[@]}" "$(cat digests/amd64)" "$(cat digests/arm64)"
          while IFS= read -r tag; do
            docker buildx imagetools inspect "$tag" --raw > manifest.json
            python3 - <<'PYTHON'
          import json
          with open("manifest.json") as manifest_file:
              manifest = json.load(manifest_file)
          platforms = {(item["platform"]["os"], item["platform"]["architecture"]) for item in manifest["manifests"]}
          assert platforms == {("linux", "amd64"), ("linux", "arm64")}, platforms
          PYTHON
          done <<< "$IMAGE_TAGS"

      - name: Prune untagged versions past retention
        if: github.event_name == 'push'
        shell: bash
        run: |
          # Deployment manifests pin the image by digest (issue #210). A
          # re-run of this workflow for the same commit produces a new digest
          # under the same short-SHA tag, briefly orphaning the pinned one.
          # Retention keeps orphaned digests alive long enough for the
          # scheduled image-promotion workflow (or a human) to heal the pin.
          echo "Pruning untagged slopsearx versions older than ${RETENTION_DAYS} days"
          cutoff="$(date -u -d "-${RETENTION_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          query=".[] | select((.metadata.container.tags == null or (.metadata.container.tags | length) == 0) and (.created_at < \"${cutoff}\")) | .id"
          gh api \
            --method GET \
            "/users/magnus919/packages/container/slopsearx/versions?per_page=100" \
            --jq "$query" \
            | while read -r version_id; do
              echo "  Deleting version $version_id"
              gh api --method DELETE \
                "/users/magnus919/packages/container/slopsearx/versions/$version_id" --silent
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_DAYS: "14"
