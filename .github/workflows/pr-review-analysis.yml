# Protected target-side analysis using the separately pinned central workflow.
name: PR Review Analysis

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: read

concurrency:
  group: protected-pr-review-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.repository == 'magnus919/SlopSearX' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    uses: groktopus/codereview/.github/workflows/pr-analysis.yml@537418ca9f542ba403b6bc6b8280eacb52d1ce0f
    permissions:
      contents: read
      checks: read
      pull-requests: read
      actions: read
    with:
      harness_repository: groktopus/codereview
      harness_sha: 537418ca9f542ba403b6bc6b8280eacb52d1ce0f
      review_contract: bounded-production-v17
      target_repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.pull_request.number }}
      base_ref: ${{ github.event.pull_request.base.ref }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      emit_publication_bundle: true
    secrets:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      JEV_BASE_URL: ${{ secrets.JEV_BASE_URL }}
      JEV_MODEL: ${{ secrets.JEV_MODEL }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
