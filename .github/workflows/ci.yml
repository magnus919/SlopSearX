name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  duplicate-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Detect duplicate code with jscpd
        run: npx jscpd --min-tokens 50 --min-lines 5 --threshold 25 slopsearx/ engines/

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Large file detection
        run: |
          echo "Checking for files over 200KB..."
          find . -name '*.py' -size +200k | sed 's/^/WARNING: /' | tee /tmp/large_files.txt
          if [ -s /tmp/large_files.txt ]; then
            echo "Large Python files detected (over 200KB). Consider splitting."
          fi
      - name: TODO/FIXME scan
        run: |
          echo "Scanning for TODO/FIXME/HACK markers..."
          rg -n 'TODO|FIXME|HACK' slopsearx/ engines/ || echo "No markers found."
      - name: Validate AGENTS.md dev setup
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -c "import slopsearx; print('Import OK')"
          pytest --collect-only -q
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements-dev.txt

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy slopsearx/ engines/

      - name: Complexity analysis with radon
        run: radon cc slopsearx/ engines/ --total-average

      - name: Maintainability index with radon
        run: radon mi slopsearx/ engines/

      - name: Dead code check with vulture
        run: vulture slopsearx/ engines/

      - name: Architecture check with import-linter
        run: lint-imports

      - name: Unused dependency check with deptry
        run: deptry . --per-rule-ignores "DEP002=lxml|uvicorn|pytest|pytest-asyncio|ruff|cssselect|mypy|pytest-cov|pip-tools|pre-commit|radon|vulture|import-linter|deptry|pip-audit|fastmcp|prometheus-client,DEP003=starlette"

  valkey-integration:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SLOPSEARX_TEST_VALKEY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Real Valkey cache and durable ownership contracts
        env:
          SLOPSEARX_TEST_VALKEY_URL: redis://127.0.0.1:6379/0
        run: pytest --no-cov -q tests/test_cache_integration.py tests/test_research_queue_integration.py tests/test_adaptive_valkey.py

  searxng-api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Check pinned SearXNG API contract
        run: pytest --no-cov -q tests/test_searxng_api_contract.py

  jev-optional-modes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mode: keyless
            expected: "0"
            key: ""
          - mode: enhanced
            expected: "1"
            key: ci-synthetic-key
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Check ${{ matrix.mode }} search path
        env:
          TYPESAFE_API_KEY: ${{ matrix.key }}
          JEV_CI_EXPECT_ENABLED: ${{ matrix.expected }}
        run: pytest --no-cov -q tests/test_jev.py::test_ci_keyless_and_enhanced_search_paths

  portal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Check portal route and formatter contracts
        run: pytest --no-cov -q tests/test_formatter.py tests/test_server.py
      - name: Check portal contract typing and lint
        run: |
          ruff check slopsearx/formatter.py slopsearx/server.py tests/test_formatter.py tests/test_server.py
          mypy slopsearx/formatter.py slopsearx/server.py

  portal-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Install browser smoke runner
        run: pip install "playwright>=1.50"
      - name: Install deterministic Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Run portal browser journeys
        env:
          PORTAL_BROWSER_SMOKE: "1"
        run: pytest --no-cov -q tests/test_portal_browser.py


  native-portal-theme-browser:
    name: Native portal theme browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install wire-only browser client dependencies
        run: python -m pip install pytest pytest-cov "playwright>=1.50"
      - name: Install deterministic Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Install repository-pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test "$toolchain" = "1.99.0"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Confirm pinned Rust toolchain
        run: rustup run 1.99.0 rustc --version --verbose
      - name: Build native HTTP fixture
        run: cargo build --locked -p ssx-http --example t02_fixture
      - name: Exercise the native HTML theme over HTTP
        env:
          PORTAL_NATIVE_HTML_THEME_SMOKE: "1"
        run: |
          set -euo pipefail
          server_pid=""
          fifo=""
          stem=""
          stop_fixture() {
            if [ -n "$server_pid" ]; then
              if kill -0 "$server_pid" 2>/dev/null; then
                printf 'STOP\n' >&3 2>/dev/null || true
                for attempt in $(seq 1 50); do
                  if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
                  sleep 0.1
                done
                if kill -0 "$server_pid" 2>/dev/null; then kill -TERM "$server_pid"; fi
                for attempt in $(seq 1 20); do
                  if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
                  sleep 0.1
                done
                if kill -0 "$server_pid" 2>/dev/null; then kill -KILL "$server_pid"; fi
              fi
              exec 3>&- || true
              wait "$server_pid" 2>/dev/null || true
              server_pid=""
            fi
            if [ -n "$fifo" ]; then rm -f "$fifo"; fifo=""; fi
            if [ -n "$stem" ]; then rm -f "$stem.log" "$stem.calls"; stem=""; fi
          }
          trap stop_fixture EXIT
          run_theme() {
            local theme="$1"
            stem="$RUNNER_TEMP/native-theme-$theme"
            fifo="$stem.stdin"
            local log="$stem.log"
            local calls="$stem.calls"
            mkfifo "$fifo"
            env -i PATH="$PATH" target/debug/examples/t02_fixture \
              "$calls" "$theme" stdin contract <"$fifo" >"$log" 2>&1 &
            server_pid=$!
            exec 3<>"$fifo"
            local ready=""
            for attempt in $(seq 1 50); do
              if grep -q '"address"' "$log"; then ready=1; break; fi
              if ! kill -0 "$server_pid" 2>/dev/null; then cat "$log" >&2; return 1; fi
              sleep 0.1
            done
            if [ -z "$ready" ]; then echo "native fixture startup timed out" >&2; cat "$log" >&2; return 1; fi
            local address
            address="$(sed -n 's/.*"address":"\([^"]*\)".*/\1/p' "$log" | head -n 1)"
            if [ -z "$address" ]; then echo "native fixture did not publish its loopback address" >&2; cat "$log" >&2; return 1; fi
            local output
            if output="$(PORTAL_NATIVE_HTML_THEME_SMOKE=1 \
                PORTAL_NATIVE_HTML_BASE_URL="http://$address/" \
                PORTAL_NATIVE_HTML_DEFAULT_THEME="$theme" \
                python -m pytest --no-cov -q tests/test_native_html_theme_browser.py 2>&1)"; then
              :
            else
              local result=$?
              printf '%s\n' "$output"
              return "$result"
            fi
            printf '%s\n' "$output"
            if ! printf '%s\n' "$output" | grep -Eq '^1 passed(, [0-9]+ warnings?)? in [0-9.]+s$'; then
              echo "expected exactly one passing native theme browser test" >&2
              return 1
            fi
            if printf '%s\n' "$output" | grep -Eq 'skipped'; then
              echo "native theme browser test must not skip" >&2
              return 1
            fi
            if [ ! -e "$calls" ] || [ -s "$calls" ]; then
              echo "theme landing/toggle requests unexpectedly dispatched a search" >&2
              if [ -e "$calls" ]; then cat "$calls" >&2; fi
              return 1
            fi
            printf 'STOP\n' >&3
            for attempt in $(seq 1 50); do
              if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
              sleep 0.1
            done
            if kill -0 "$server_pid" 2>/dev/null; then
              echo "native fixture did not stop after STOP" >&2
              return 1
            fi
            exec 3>&-
            if ! wait "$server_pid"; then echo "native fixture exited unsuccessfully" >&2; return 1; fi
            server_pid=""
            rm -f "$fifo" "$log" "$calls"
            fifo=""
            stem=""
          }
          run_theme dark
          run_theme darker
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest and coverage
        run: |
          # Live loopback servers can leave event-loop resources pending when
          # several transport modules share one hosted-runner process. Run each
          # such module in a fresh process and combine their coverage below.
          isolated_tests=(
            tests/test_adaptive_transport.py
            tests/test_entity_transport.py
            tests/test_http_pooling.py
            tests/test_mcp_gateway.py
            tests/test_mcp_gateway_lifecycle.py
            tests/test_mcp_gateway_initialization.py
            tests/test_mcp_harness.py
            tests/test_mcp_oauth.py
            tests/test_mcp_oauth_client.py
            tests/test_retrieval_receipts_transport.py
            tests/test_saved_events_transport.py
            tests/test_saved_transport.py
            tests/test_workflow_composition_transport.py
          )

          pytest -v -o addopts='' -o faulthandler_timeout=60 \
            --cov=slopsearx --cov=engines --cov-report= --cov-fail-under=0 \
            "${isolated_tests[0]}"

          for test_file in "${isolated_tests[@]:1}"; do
            pytest -v -o addopts='' -o faulthandler_timeout=60 \
              --cov=slopsearx --cov=engines --cov-append \
              --cov-report= --cov-fail-under=0 "$test_file"
          done

          ignore_args=()
          for test_file in "${isolated_tests[@]}"; do
            ignore_args+=("--ignore=$test_file")
          done
          pytest -v -o addopts='' -o faulthandler_timeout=60 --durations=10 \
            "${ignore_args[@]}" \
            --cov=slopsearx --cov=engines --cov-append \
            --cov-report=term-missing --cov-report=html --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/

  monitoring-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure hosted-runner Docker Hub cache
        run: python3 scripts/configure_ci_dockerhub_mirror.py
      - name: Validate Prometheus rules and firing behavior
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/docs/alerting:/rules:ro" prom/prometheus:v3.2.1 check rules /rules/rules.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/docs/alerting:/rules:ro" prom/prometheus:v3.2.1 test rules /rules/rules.test.yml
