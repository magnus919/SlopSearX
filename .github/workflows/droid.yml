name: Droid Tag

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, edited]

jobs:
  droid:
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@droid')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@droid')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@droid')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@droid') || contains(github.event.issue.title, '@droid'))) ||
        (github.event_name == 'pull_request' && (contains(github.event.pull_request.body, '@droid') || contains(github.event.pull_request.title, '@droid')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # BYOK: install the repo's custom-model config on the runner so @droid
      # runs use your own keys (see .github/droid-settings.json). `droid exec`
      # reads $HOME/.factory/settings.json, and each apiKey references a
      # secret-backed env var exported on the action step below.
      # Secrets required: DEEPSEEK_API_KEY, NOUS_API_KEY, QWEN_API_KEY
      # (Settings > Secrets and variables > Actions).
      - name: Install Droid BYOK settings
        shell: bash
        run: |
          mkdir -p "$HOME/.factory"
          cp .github/droid-settings.json "$HOME/.factory/settings.json"

      - name: Run Droid Exec
        uses: Factory-AI/droid-action@7c7bfea2aa3bb7ea87579402cc1d89dbcf6b13b3
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          # BYOK model overrides covering every @droid flow (review, security,
          # security-full, fill). Any provider model id from
          # .github/droid-settings.json works here.
          review_model: "deepseek-v4-flash"
          security_model: "deepseek-v4-flash"
          fill_model: "deepseek-v4-flash"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
