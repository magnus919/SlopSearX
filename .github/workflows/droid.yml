name: Droid Tag

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, edited]

jobs:
  droid:
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@droid')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@droid')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@droid')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@droid') || contains(github.event.issue.title, '@droid'))) ||
        (github.event_name == 'pull_request' && (contains(github.event.pull_request.body, '@droid') || contains(github.event.pull_request.title, '@droid')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Install the repo's LiteLLM model config. The API key is supplied by
      # the GPUSLUT_API_KEY repository secret on the action step below.
      - name: Install Droid BYOK settings
        shell: bash
        run: |
          mkdir -p "$HOME/.factory"
          cp .github/droid-settings.json "$HOME/.factory/settings.json"

      - name: Run Droid Exec
        uses: Factory-AI/droid-action@2041e7cc36d1390346bdaa6616e4bf7ac6b96b27
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          # Route every @droid flow through LiteLLM's general alias.
          review_model: "general"
          security_model: "general"
          fill_model: "general"
        env:
          GPUSLUT_API_KEY: ${{ secrets.GPUSLUT_API_KEY }}
