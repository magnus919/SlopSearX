name: Native CI and review successors

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  successors:
    name: Native CI and protected review preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Native helper and adversarial trust-boundary tests
        run: cargo test --locked -p xtask 'o06::tests::'
      - name: Source-bound gate inventory and protected provenance
        run: cargo xtask check O06 --output target/rust-evidence/O06.json
      - name: Retain native successor evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ci-successors-${{ github.sha }}
          path: target/rust-evidence/O06.json
          if-no-files-found: error

  optional-python-client:
    name: Optional Python wire client (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Standalone optional client syntax and CLI discovery
        run: |
          python -I -m py_compile ssx
          python -I ssx --help
