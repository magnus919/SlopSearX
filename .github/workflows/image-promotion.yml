name: Image Digest Promotion

on:
  schedule:
    # Daily drift check against the CI-published 'latest' artifact.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install repository-pinned Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"\]*\)"/\1/p' rust-toolchain.toml)"
          test "$toolchain" = "1.99.0"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Confirm pinned Rust toolchain
        run: rustup run 1.99.0 rustc --version --verbose

      - name: Recover an interrupted native digest transaction
        run: cargo xtask ci-helper image-pin-promote --recover

      - name: Cross-check the native digest tool against the pinned state
        run: |
          set +e
          cargo xtask ci-helper image-pin-promote --check
          code=$?
          set -e
          case "$code" in
            0|1) ;;
            *) echo "::error::Native digest check failed (exit $code)."; exit 1 ;;
          esac

      - name: Promote pinned image digest if CI published a newer one
        id: promote
        run: |
          set +e
          cargo xtask ci-helper image-pin-promote --write --root .
          code=$?
          set -e
          case "$code" in
            0|10) ;;
            *) echo "::error::Native digest promotion failed (exit $code); inspect retained recovery journal."; exit 1 ;;
          esac
          cargo xtask ci-helper image-pin-promote --recover
          test ! -e .ssx-image-promotion
          test ! -e .ssx-image-promotion-cleanup.json
          test ! -e .ssx-image-promotion-cleanup.pending
          echo "changed=$(git status --porcelain | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Open or update promotion PR
        if: steps.promote.outputs.changed != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            docker-compose.yml
            k8s/deployment.yaml
            tests/test_deployment_artifacts.py
            spec.md
          branch: chore/promote-image-digest
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: true
          labels: ci,automated
          commit-message: "chore: promote slopsearx image digest to current latest"
          title: "chore: promote slopsearx image digest to current latest"
          body: |
            Automated promotion of the digest-pinned application image
            (`ghcr.io/magnus919/slopsearx`) in docker-compose.yml,
            k8s/deployment.yaml, tests/test_deployment_artifacts.py, and the
            two spec.md examples, so deployments track the
            artifact CI most recently built, Trivy-scanned, and smoke-tested
            on main (#210).

            Generated by `.github/workflows/image-promotion.yml`. The native
            `cargo xtask ci-helper image-pin-promote` recovers interrupted local
            transactions, checks drift, and writes the four reviewed digest operands.
            Registry publication and deployment remain separate operations.
