name: Image Digest Promotion

on:
  schedule:
    # Daily drift check against the CI-published 'latest' artifact.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Build and test native image promotion
        run: |
          ops_root="$RUNNER_TEMP/ssx-image-promotion"
          mkdir -p "$ops_root/target" "$ops_root/tool" "$ops_root/tmp"
          export CARGO_TARGET_DIR="$ops_root/target"
          export CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_INCREMENTAL=0
          export TMPDIR="$ops_root/tmp"
          cargo test --locked -p ssx-ops -- --test-threads=1
          cargo build --locked -p ssx-ops --bin ssx-ops
          cp "$CARGO_TARGET_DIR/debug/ssx-ops" "$ops_root/tool/ssx-ops"
          chmod 700 "$ops_root/tool/ssx-ops"
          printf 'SSX_IMAGE_OPS_BIN=%s\n' "$ops_root/tool/ssx-ops" >> "$GITHUB_ENV"

      - name: Promote pinned image digest if CI published a newer one
        id: promote
        run: |
          set -o pipefail
          set +e
          "$SSX_IMAGE_OPS_BIN" promote-image-digest --write --root .
          code=$?
          set -e
          case "$code" in
            0) echo "changed=0" >> "$GITHUB_OUTPUT" ;;
            10) echo "changed=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Digest promotion failed; inspect pin-state/registry/IO evidence."; exit 1 ;;
          esac

      - name: Open or update promotion PR
        if: steps.promote.outputs.changed != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            docker-compose.yml
            k8s/deployment.yaml
            spec.md
          branch: chore/promote-image-digest
          delete-branch: true
          labels: ci,automated
          commit-message: "chore: promote slopsearx image digest to current latest"
          title: "chore: promote slopsearx image digest to current latest"
          body: |
            Automated promotion of the digest-pinned application image
            (`ghcr.io/magnus919/slopsearx`) in docker-compose.yml,
            k8s/deployment.yaml and synchronized spec.md examples, so
            deployments track the
            artifact CI most recently built, Trivy-scanned, and smoke-tested
            on main (#210).

            Generated by `.github/workflows/image-promotion.yml`; see
            `ssx-ops promote-image-digest --write --root .`.

      - name: Retire native image promotion inputs
        if: always()
        run: |
          ops_root="$RUNNER_TEMP/ssx-image-promotion"
          rm -rf -- "$ops_root"
