name: Rust client platforms

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Native runners, never cross-compilation as runtime evidence. This lane excludes
# server features and release signing/promotion (O04 remains separate).
jobs:
  client-platform:
    name: Client install and security (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ runner.temp }}/ssx-client-target
      SLOPSEARX_INSTALL_TEST_ROOT: ${{ runner.temp }}/ssx-client-install
      SLOPSEARX_T07_UNIT_TEST_ROOT: ${{ runner.temp }}/ssx-client-unit
      SLOPSEARX_PRODUCTION_ARTIFACT_MANIFEST: ${{ runner.temp }}/ssx-client-evidence/production-artifacts.json
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v7
      - name: Record actual native host and pinned inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ssx-client-evidence"
          rustc --version --verbose | tee "$RUNNER_TEMP/ssx-client-evidence/toolchain.txt"
          test "$(rustc --version --verbose | sed -n 's/^host: //p')" = '${{ matrix.target }}'
          git rev-parse HEAD | tee "$RUNNER_TEMP/ssx-client-evidence/head.txt"
          git diff --exit-code
      - name: Prepare private Unix fixture roots
        if: runner.os != 'Windows'
        run: mkdir -m 700 "$SLOPSEARX_INSTALL_TEST_ROOT" "$SLOPSEARX_T07_UNIT_TEST_ROOT"
      - name: Prepare protected Windows fixture roots
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          foreach ($path in @($env:SLOPSEARX_INSTALL_TEST_ROOT, $env:SLOPSEARX_T07_UNIT_TEST_ROOT)) {
            if (Test-Path -LiteralPath $path) { throw 'Refuse to adopt a preexisting fixture root' }
            New-Item -ItemType Directory -Path $path | Out-Null
            $acl = [System.Security.AccessControl.DirectorySecurity]::new()
            $acl.SetOwner($sid)
            $acl.SetAccessRuleProtection($true, $false)
            foreach ($principal in @($sid, [System.Security.Principal.SecurityIdentifier]::new('S-1-5-18'), [System.Security.Principal.SecurityIdentifier]::new('S-1-5-32-544'))) {
              $rule = [System.Security.AccessControl.FileSystemAccessRule]::new($principal, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
              $acl.AddAccessRule($rule)
            }
            Set-Acl -LiteralPath $path -AclObject $acl
          }
      - name: Prove default client dependency boundary and production executables
        run: |
          set -euo pipefail
          cargo tree --locked -p ssx-gateway --no-default-features --edges normal > "$RUNNER_TEMP/ssx-client-evidence/client-tree.txt"
          if grep -E 'ssx-(application|infra|http|registry|config|worker) v' "$RUNNER_TEMP/ssx-client-evidence/client-tree.txt"; then
            echo 'Server dependency entered client-only graph' >&2
            exit 1
          fi
          cargo build --locked -p ssx-gateway --no-default-features --bin ssx-gateway --bin ssx-gateway-dns --bin ssx-gateway-input --message-format=json > "$RUNNER_TEMP/ssx-client-evidence/client-build.jsonl"
      - name: Preserve exact default production artifacts before feature builds
        shell: pwsh
        run: |
          ./crates/ssx-gateway/tests/platform_support/seal-production.ps1 -BuildJson "$env:RUNNER_TEMP/ssx-client-evidence/client-build.jsonl" -OutputRoot "$env:RUNNER_TEMP/ssx-client-shipping" -Manifest $env:SLOPSEARX_PRODUCTION_ARTIFACT_MANIFEST -Target '${{ matrix.target }}'
      - name: Assert compiled platform test inventory before execution
        run: |
          set -euo pipefail
          cargo test --locked -p ssx-gateway --no-default-features --features source-endpoint-test-fixtures,windows-owner-test-fixtures --test t07_platform_install --test t07_platform_tls --test t07_runtime --test t07_windows_owner --test t07_windows_security -- --list 2>&1 | tee "$RUNNER_TEMP/ssx-client-evidence/compiled-inventory.txt"
      - name: Verify required named native cases are present exactly once
        shell: pwsh
        run: |
          ./crates/ssx-gateway/tests/platform_support/verify-inventory.ps1 -Inventory "$env:RUNNER_TEMP/ssx-client-evidence/compiled-inventory.txt"
      - name: Native installed client and private TLS witnesses
        run: |
          set -euo pipefail
          features=source-endpoint-test-fixtures,windows-owner-test-fixtures
          cargo test --locked -p ssx-gateway --no-default-features --features "$features" --test t07_platform_install --test t07_platform_tls --test t07_runtime --test t07_windows_owner --test t07_windows_security -- --nocapture 2>&1 | tee "$RUNNER_TEMP/ssx-client-evidence/runtime.txt"
      - name: Assert exact ignored hosted trust-store inventory
        run: |
          set -euo pipefail
          cargo test --locked -p ssx-gateway --no-default-features --features source-endpoint-test-fixtures,windows-owner-test-fixtures --test t07_platform_tls installed_platform_verifier_rejects_private_ca_then_accepts_exact_system_store_and_still_checks_hostname -- --exact --ignored --list 2>&1 | tee "$RUNNER_TEMP/ssx-client-evidence/store-inventory.txt"
      - name: Verify nonzero exact hosted trust-store case
        shell: pwsh
        run: |
          ./crates/ssx-gateway/tests/platform_support/verify-inventory.ps1 -Inventory "$env:RUNNER_TEMP/ssx-client-evidence/store-inventory.txt" -IgnoredOnly
      - name: Dedicated ephemeral platform trust-store witness
        env:
          SLOPSEARX_PLATFORM_TRUST_FIXTURE: '1'
        run: |
          set -euo pipefail
          # This runner is disposable. Exact CA cleanup also runs in the finalizer.
          trap 'for case_root in "$SLOPSEARX_INSTALL_TEST_ROOT"/platform-tls-store-*; do if [[ -f "$case_root/trust-active" ]]; then bash crates/ssx-gateway/tests/platform_support/trust-store.sh remove "$case_root"; fi; done' EXIT
          cargo test --locked -p ssx-gateway --no-default-features --features source-endpoint-test-fixtures,windows-owner-test-fixtures --test t07_platform_tls installed_platform_verifier_rejects_private_ca_then_accepts_exact_system_store_and_still_checks_hostname -- --exact --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/ssx-client-evidence/platform-store.txt"
      - name: Always remove exact owned CI trust fixtures
        if: always()
        env:
          SLOPSEARX_PLATFORM_TRUST_FIXTURE: '1'
        run: |
          set -euo pipefail
          for case_root in "$SLOPSEARX_INSTALL_TEST_ROOT"/platform-tls-store-*; do
            if [[ -f "$case_root/trust-active" ]]; then
              bash crates/ssx-gateway/tests/platform_support/trust-store.sh remove "$case_root"
            fi
          done
      - name: Retain exact host receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-client-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/ssx-client-evidence
          if-no-files-found: error
      - name: Remove this job's reproducible target and fixture roots
        if: always()
        run: |
          set -euo pipefail
          # Only fixed directories owned by this ephemeral job, never a cache.
          for case_root in "$SLOPSEARX_INSTALL_TEST_ROOT"/platform-tls-store-*; do
            test ! -f "$case_root/trust-active"
          done
          rm -rf -- "$CARGO_TARGET_DIR" "$SLOPSEARX_INSTALL_TEST_ROOT" "$SLOPSEARX_T07_UNIT_TEST_ROOT" "$RUNNER_TEMP/ssx-client-shipping"
