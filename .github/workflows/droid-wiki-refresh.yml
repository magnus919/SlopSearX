name: Droid Wiki Refresh

on:
  push:
    branches: [main]

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Factory Droid
        run: curl -fsSL https://app.factory.ai/cli | sh

      # Install the repo's LiteLLM model config. The API key is supplied by
      # the GPUSLUT_API_KEY repository secret on the run step below.
      - name: Install Droid BYOK settings
        shell: bash
        run: |
          mkdir -p "$HOME/.factory"
          cp .github/droid-settings.json "$HOME/.factory/settings.json"

      - name: Generate wiki
        run: droid exec --auto high --model "general" "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GPUSLUT_API_KEY: ${{ secrets.GPUSLUT_API_KEY }}
