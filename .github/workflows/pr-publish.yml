# Same-repository protected PR review publisher using the target Actions token.
name: Protected PR review publisher (Actions token)

on:
  workflow_run:
    workflows:
      - PR Review Analysis
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-review-publish-${{ github.repository_id }}
  queue: max
  cancel-in-progress: false

jobs:
  publisher:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.repository == 'magnus919/SlopSearX' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: code-review-publication
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out only protected default-branch publisher source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the separately pinned harness
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          TRUSTED_HARNESS_SHA = "23852759ed3cfb1e6964b7438141e293508aa178"
          policy = json.loads((Path(os.environ["GITHUB_WORKSPACE"]) / ".github/pr-review-publisher-policy.json").read_text())
          harness = policy["called_harness"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", harness["repository"]):
              raise SystemExit("protected_harness_repository_invalid")
          if not re.fullmatch(r"(?:[0-9a-f]{40}|[0-9a-f]{64})", harness["sha"]):
              raise SystemExit("protected_harness_revision_invalid")
          if harness["sha"] != TRUSTED_HARNESS_SHA:
              raise SystemExit("protected_harness_revision_unreviewed")
          dest = Path(os.environ["RUNNER_TEMP"]) / "trusted-review-harness"
          subprocess.run(["git", "clone", "--no-checkout", "--filter=blob:none", f"https://github.com/{harness['repository']}.git", str(dest)], check=True, stdin=subprocess.DEVNULL, timeout=120)
          subprocess.run(["git", "-C", str(dest), "checkout", "--detach", TRUSTED_HARNESS_SHA], check=True, stdin=subprocess.DEVNULL, timeout=30)
          if subprocess.check_output(["git", "-C", str(dest), "rev-parse", "HEAD"], text=True, timeout=10).strip() != TRUSTED_HARNESS_SHA:
              raise SystemExit("protected_harness_revision_mismatch")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install the pinned trusted harness
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: python -m pip install "${RUNNER_TEMP}/trusted-review-harness"

      - name: Set up the official artifact bridge runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install the lockfile-pinned official artifact client
        working-directory: ${{ runner.temp }}/trusted-review-harness/scripts/actions-artifact-uploader
        env:
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_RESULTS_URL: ''
          ACTIONS_RUNTIME_URL: ''
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the protected publication runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ runner.temp }}/trusted-review-harness/src
        run: python -m pr_review_harness.protected_publication_runtime

# The writer job needs contents:read to check out its protected policy/runtime
# source. That token remains available to the trusted job's actions and code;
# the job must never check out or execute the PR head or install target code.
# Its permissions are declared scope only. They do not attest effective server
# write access. The central Slop pilot remains read-only; target secrets do not
# cross repositories. This route uses the target's per-job GITHUB_TOKEN and
# creates no App key or installation token.
