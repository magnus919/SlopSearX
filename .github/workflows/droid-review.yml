name: Droid Auto Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Install the repo's LiteLLM model config. The API key is supplied by
      # the GPUSLUT_API_KEY repository secret on the action step below.
      - name: Install Droid BYOK settings
        shell: bash
        run: |
          mkdir -p "$HOME/.factory"
          cp .github/droid-settings.json "$HOME/.factory/settings.json"

      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@2041e7cc36d1390346bdaa6616e4bf7ac6b96b27
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          review_depth: deep
          automatic_security_review: true
          allowed_bots: "dependabot"
          # Both review passes and the security pass use LiteLLM's general
          # routing alias from .github/droid-settings.json.
          review_model: "general"
          security_model: "general"
        env:
          GPUSLUT_API_KEY: ${{ secrets.GPUSLUT_API_KEY }}
