name: Native CLI component

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-cli:
    name: Native CLI (${{ matrix.target }})
    uses: ./.github/workflows/rust-cli-target.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
  native-cli-windows:
    name: Native CLI (x86_64-pc-windows-msvc, advisory)
    uses: ./.github/workflows/rust-cli-target.yml
    with:
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      advisory: true
  native-cli-acceptance:
    name: Native CLI component acceptance
    if: ${{ always() }}
    needs: [native-cli]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the Linux and macOS native client targets
        env:
          MATRIX_RESULT: ${{ needs.native-cli.result }}
        run: |
          if [ "$MATRIX_RESULT" != success ]; then
            echo "::error::native-cli matrix did not succeed ($MATRIX_RESULT)"
            exit 1
          fi
