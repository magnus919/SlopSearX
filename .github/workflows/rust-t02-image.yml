name: Native T02 Python-free HTTP image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t02-image:
    name: T02 real HTTP image (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build scoped native service image
        timeout-minutes: 35
        run: docker build --file crates/ssx-http/Dockerfile.t02 --tag ssx-t02-http:${{ github.sha }} .
      - name: Verify actual HTTP process without Python or external networking
        timeout-minutes: 5
        run: |
          mkdir -p target/rust-evidence
          docker image inspect ssx-t02-http:${{ github.sha }} > target/rust-evidence/T02-image-identity.json
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m ssx-t02-http:${{ github.sha }} > target/rust-evidence/T02-image-smoke.json
      - name: Retain image identity and actual independent-client evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-t02-image-${{ github.sha }}
          path: target/rust-evidence/T02-image-*.json
          if-no-files-found: error
