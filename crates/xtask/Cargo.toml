[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
ssx-domain.workspace = true
ssx-wire.workspace = true
ssx-http.workspace = true
ssx-mcp.workspace = true
sha2.workspace = true
ssx-json.workspace = true
ssx-registry.workspace = true
ssx-application.workspace = true

# Developer gate process containment only; absent from production ssx graph.
[dependencies.process-wrap]
version = "=10.0.1"
default-features = false
features = ["tokio1", "process-group", "job-object", "kill-on-drop"]

[dependencies.tokio]
workspace = true

[target.'cfg(unix)'.dependencies.nix]
version = "=0.31.3"
features = ["signal"]
