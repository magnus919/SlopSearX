[package]
name = "ssx-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ssx-application.workspace = true
ssx-infra.workspace = true
ssx-config.workspace = true
ssx-registry.workspace = true
unicode-normalization = "=0.1.24"
ssx-wire.workspace = true
rmcp = { workspace = true, features = ["client", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
tokio.workspace = true
axum = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
reqwest = { workspace = true, features = ["stream"] }
tokio-util = "=0.7.20"
futures-util = "=0.3.34"
uuid = { version = "=1.28.0", features = ["v4"] }
subtle = "=2.6.1"
sse-stream = "=0.2.6"
ssx-domain.workspace = true
ssx-json.workspace = true
ssx-source-codecs = { workspace = true, features = ["source-gateway-url"] }

# T05 protocol codecs and accepted AWS-LC credential randomness.
base64 = "=0.23.1"
url.workspace = true
sha2.workspace = true
rustls.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
redis.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
rmcp = { workspace = true, features = ["auth"] }
oauth2 = { version = "=5.0.0", default-features = false }

[target.'cfg(unix)'.dependencies.nix]
version = "=0.31.3"
features = ["fs"]
