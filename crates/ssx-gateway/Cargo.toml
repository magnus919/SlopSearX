[package]
name = "ssx-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
source-endpoint-test-fixtures = ["dns-test-fixtures", "ssx-mcp/gateway-source-endpoints"]
dns-test-fixtures = ["ssx-mcp/gateway-dns-fixtures"]

[[bin]]
name = "ssx-gateway-dns-fixture"
path = "src/bin/ssx-gateway-dns-fixture.rs"
required-features = ["dns-test-fixtures"]

[dependencies]
ssx-wire.workspace = true
rmcp.workspace = true
clap.workspace = true
ssx-mcp = { workspace = true, features = ["gateway-source-endpoints"] }
tokio.workspace = true
tokio-util = "=0.7.20"

[dev-dependencies]
futures-util = "=0.3.34"
axum.workspace = true
serde_json.workspace = true
reqwest.workspace = true
base64.workspace = true
sha2.workspace = true
ssx-application.workspace = true
ssx-domain.workspace = true
ssx-infra.workspace = true
ssx-registry.workspace = true
ssx-config.workspace = true
ssx-json.workspace = true
redis.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }
