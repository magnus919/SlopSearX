[package]
name = "ssx-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
server-test-fixtures = ["ssx-mcp/server", "dep:ssx-application", "dep:ssx-infra", "dep:ssx-registry", "dep:ssx-config"]
source-endpoint-test-fixtures = ["dns-test-fixtures", "ssx-mcp/gateway-source-endpoints"]
dns-test-fixtures = ["ssx-mcp/gateway-dns-fixtures"]
windows-owner-test-fixtures = ["dns-test-fixtures", "dep:ssx-windows-owner", "ssx-windows-owner/fixtures"]

[[bin]]
name = "ssx-gateway-dns-fixture"
path = "src/bin/ssx-gateway-dns-fixture.rs"
required-features = ["dns-test-fixtures"]

[[bin]]
name = "ssx-gateway-owner-probe"
path = "src/bin/ssx-gateway-owner-probe.rs"
required-features = ["windows-owner-test-fixtures"]

[dependencies]
ssx-wire.workspace = true
rmcp.workspace = true
clap.workspace = true
ssx-mcp = { workspace = true, features = ["gateway-source-endpoints"] }
tokio.workspace = true
tokio-util = "=0.7.20"

ssx-application = { workspace = true, optional = true }
ssx-infra = { workspace = true, optional = true }
ssx-registry = { workspace = true, optional = true }
ssx-config = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
ssx-windows-owner = { path = "../../vendor/ssx-windows-owner", version = "=0.1.0", optional = true }

[dev-dependencies]
rustls.workspace = true
tokio-rustls.workspace = true
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
futures-util = "=0.3.34"
axum.workspace = true
serde_json.workspace = true
reqwest.workspace = true
base64.workspace = true
sha2.workspace = true
ssx-domain.workspace = true
ssx-json.workspace = true
redis.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }
