# SlopSearX — drop-in replacement for SearXNG in GroktoCrawl stack
# Runs on the groktocrawl stack's network so agent-svc can reach it.
# No host port — internal-only for the stack.
#
# This default uses the immutable GHCR artifact promoted from main commit 851090f.
# For a local source build, use docker-compose.build.yml explicitly.

services:
  slopsearx:
    image: ghcr.io/magnus919/slopsearx@sha256:1cd1d05cac718662fd46a324d12fb085e719aba07739329847246b1881d81c7a
    ports:
      - "8080"
    env_file:
      - ../.env
    environment:
      - VALKEY_URL=redis://valkey:6379/0
    restart: unless-stopped

networks:
  default:
    name: groktocrawl_default
    external: true
